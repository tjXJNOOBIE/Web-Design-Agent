<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Web Design Agent architecture</title>
  <desc id="desc">A public MCP request enters a Strands Director, which coordinates three candidate agents and a visual critic before deterministic evidence validation, review, refinement, and export.</desc>
  <rect width="1200" height="430" fill="#08111f"/>
  <g font-family="Arial, sans-serif" font-size="17" fill="#f8fafc" text-anchor="middle">
    <g stroke="#93c5fd" stroke-width="2" fill="#172554">
      <rect x="25" y="175" width="150" height="72" rx="14"/><rect x="215" y="175" width="150" height="72" rx="14"/>
      <rect x="405" y="70" width="145" height="62" rx="14"/><rect x="405" y="180" width="145" height="62" rx="14"/><rect x="405" y="290" width="145" height="62" rx="14"/>
      <rect x="600" y="175" width="145" height="72" rx="14"/><rect x="795" y="175" width="165" height="72" rx="14"/><rect x="1010" y="175" width="160" height="72" rx="14"/>
    </g>
    <text x="100" y="204">Vague request</text><text x="100" y="227">human intent</text>
    <text x="290" y="204">Public NoAuth</text><text x="290" y="227">MCP + App</text>
    <text x="477" y="108">Candidate A</text><text x="477" y="218">Candidate B</text><text x="477" y="328">Candidate C</text>
    <text x="672" y="204">Strands Director</text><text x="672" y="227">+ Visual Critic</text>
    <text x="877" y="204">Evidence</text><text x="877" y="227">validation</text>
    <text x="1090" y="204">Review</text><text x="1090" y="227">refine / export</text>
    <g stroke="#fbbf24" stroke-width="3" fill="none" marker-end="url(#arrow)">
      <path d="M175 211H215"/><path d="M365 211H405"/><path d="M550 101H600"/><path d="M550 211H600"/><path d="M550 321H600"/><path d="M745 211H795"/><path d="M960 211H1010"/>
    </g>
  </g>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#fbbf24"/></marker></defs>
</svg>
