<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Three Directions, One Evidence Contract</title><desc id="desc">Web Design Agent turns a vague request into three structurally different candidates through Strands, grounds them in real browser and provider evidence, then lets a human review, tune, refine, and export the selected direction.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#090B0F"/><stop offset="1" stop-color="#10151D"/></linearGradient>
<style>.t{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#F8FAFC}.m{fill:#A8B3C4}.title{font-size:60px;font-weight:760;letter-spacing:-1.1px}.sub{font-size:27px}.head{font-size:30px;font-weight:700}.body{font-size:24px}.small{font-size:21px}.card{fill:#111823;stroke:#2B3646;stroke-width:2}.soft{fill:#0D141E;stroke:#263243;stroke-width:2}.line{stroke:#7DD3FC;stroke-width:4;fill:none}.dash{stroke:#A78BFA;stroke-width:4;stroke-dasharray:12 10;fill:none}</style>
<marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#7DD3FC"/></marker><marker id="p" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#A78BFA"/></marker>
</defs>
<rect width="1600" height="900" rx="34" fill="url(#bg)"/>
<text x="82" y="98" class="t title">Three Directions, One Evidence Contract</text><text x="82" y="143" class="t sub m">A/B/C differ structurally. Tool evidence proves what actually happened.</text>
<rect x="545" y="210" width="510" height="430" rx="34" fill="#0D1A25" stroke="#5FD6F3" stroke-width="2.5"/>
<text x="590" y="270" class="t head">Strands Design Director</text>
<text x="590" y="330" class="t body m">Brief</text><text x="780" y="330" class="t body">Infer intent</text>
<text x="590" y="380" class="t body m">Generate</text><text x="780" y="380" class="t body">A / B / C agents</text>
<text x="590" y="430" class="t body m">Critique</text><text x="780" y="430" class="t body">Visual specialist</text>
<text x="590" y="480" class="t body m">Ground</text><text x="780" y="480" class="t body">Real tool evidence</text>
<text x="590" y="530" class="t body m">Refine</text><text x="780" y="530" class="t body">Selected candidate</text>
<rect x="590" y="570" width="420" height="44" rx="14" class="soft"/><text x="675" y="599" class="t small">Model cannot certify itself</text>
<rect x="90" y="240" width="330" height="150" rx="28" class="card"/><text x="125" y="300" class="t head">Vague request</text><text x="125" y="348" class="t body m">Human product intent</text>
<rect x="90" y="475" width="330" height="150" rx="28" class="card"/><text x="125" y="535" class="t head">Design tools</text><text x="125" y="583" class="t body m">Browser + components + art</text>
<rect x="1180" y="240" width="330" height="150" rx="28" class="card"/><text x="1215" y="300" class="t head">Evidence validator</text><text x="1215" y="348" class="t body m">Bind calls to candidates</text>
<rect x="1180" y="475" width="330" height="150" rx="28" class="card"/><text x="1215" y="535" class="t head">Review + refine</text><text x="1215" y="583" class="t body m">Human selects direction</text>
<rect x="650" y="690" width="300" height="115" rx="28" class="card"/><text x="700" y="744" class="t head">Export</text><text x="700" y="784" class="t small m">HTML / CSS / JS + system</text>
<path d="M545 330 L420 315" class="line" marker-end="url(#a)"/><path d="M545 505 L420 550" class="line" marker-end="url(#a)"/><path d="M1055 330 L1180 315" class="line" marker-end="url(#a)"/><path d="M1055 505 L1180 550" class="line" marker-end="url(#a)"/><path d="M800 640 L800 690" class="line" marker-end="url(#a)"/>
<rect x="90" y="700" width="430" height="105" rx="24" class="soft"/><text x="125" y="744" class="t head">Structural diversity</text><text x="125" y="782" class="t small m">Not three recolored templates.</text>
<rect x="1080" y="700" width="430" height="105" rx="24" class="soft"/><text x="1115" y="744" class="t head">Runtime grounded</text><text x="1115" y="782" class="t small m">Successful tool calls become evidence.</text>
</svg>